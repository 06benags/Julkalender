<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🎄 Julens Hemlighet 🎄</title>

<style>

/* =====================================================
   GRUND
===================================================== */

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Georgia, "Times New Roman", serif;

    color: white;
    text-align: center;

    background:
        radial-gradient(
            circle at top,
            rgba(255,255,255,0.12),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #300909,
            #650f16,
            #180606
        );

    overflow-x: hidden;
}


/* =====================================================
   RUBRIK
===================================================== */

h1 {
    margin: 30px 15px 5px;

    font-size: clamp(2.2rem, 6vw, 4rem);

    color: #ffe8a3;

    text-shadow:
        0 0 8px #ffd45c,
        0 0 20px rgba(255,210,80,0.6);
}

.subtitle {
    margin: 0 15px 10px;

    font-size: 1.1rem;

    color: #fff4d0;
}

.garland {
    font-size: 2rem;

    margin: 10px 0 25px;

    letter-spacing: 12px;
}


/* =====================================================
   JULKALENDER
===================================================== */

.calendar {
    width: min(900px, 94%);

    margin: 0 auto 30px;

    display: grid;

    grid-template-columns: repeat(4, 1fr);

    gap: 15px;
}


/* =====================================================
   LUCKOR
===================================================== */

.door {
    position: relative;

    min-height: 150px;

    border: 3px solid #e7b94e;

    border-radius: 16px;

    background:
        linear-gradient(
            145deg,
            #b51f2d,
            #73101b
        );

    box-shadow:
        0 8px 20px rgba(0,0,0,0.45),
        inset 0 0 20px rgba(255,255,255,0.08);

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 2.8rem;

    font-weight: bold;

    color: #ffe9a8;

    cursor: pointer;

    transition:
        transform 0.2s,
        box-shadow 0.2s;

    overflow: hidden;
}


/* Dekoration på luckorna */

.door::before {
    content: "✦";

    position: absolute;

    top: 7px;
    left: 12px;

    font-size: 0.9rem;
}

.door::after {
    content: "✦";

    position: absolute;

    bottom: 7px;
    right: 12px;

    font-size: 0.9rem;
}


/* Hover */

.door:hover {
    transform: translateY(-5px) scale(1.02);

    box-shadow:
        0 12px 28px rgba(0,0,0,0.55),
        0 0 18px rgba(255,215,100,0.35);
}


/* =====================================================
   LÅSTA LUCKOR
===================================================== */

.door.locked {
    background:
        linear-gradient(
            145deg,
            #451016,
            #26070a
        );

    color: #888;

    border-color: #684044;

    cursor: not-allowed;
}

.door.locked:hover {
    transform: none;
}


/* =====================================================
   LÖSTA LUCKOR
===================================================== */

.door.solved {
    background:
        linear-gradient(
            145deg,
            #d6a832,
            #956512
        );

    border-color: #fff0a3;

    box-shadow:
        0 0 20px rgba(255,214,85,0.5),
        inset 0 0 20px rgba(255,255,255,0.12);
}


/* =====================================================
   FOOTER
===================================================== */

.footer {
    margin: 10px 20px 35px;

    color: #f6df9c;
}


/* =====================================================
   SNÖ
===================================================== */

.snow {
    position: fixed;

    top: -30px;

    color: white;

    pointer-events: none;

    z-index: 1;

    opacity: 0.8;

    animation: snowFall linear infinite;
}

.snow1 {
    left: 5%;
    font-size: 14px;
    animation-duration: 10s;
}

.snow2 {
    left: 15%;
    font-size: 24px;
    animation-duration: 14s;
    animation-delay: -3s;
}

.snow3 {
    left: 27%;
    font-size: 11px;
    animation-duration: 9s;
    animation-delay: -5s;
}

.snow4 {
    left: 39%;
    font-size: 20px;
    animation-duration: 13s;
    animation-delay: -7s;
}

.snow5 {
    left: 51%;
    font-size: 15px;
    animation-duration: 11s;
    animation-delay: -2s;
}

.snow6 {
    left: 63%;
    font-size: 27px;
    animation-duration: 15s;
    animation-delay: -6s;
}

.snow7 {
    left: 74%;
    font-size: 13px;
    animation-duration: 10s;
    animation-delay: -4s;
}

.snow8 {
    left: 83%;
    font-size: 22px;
    animation-duration: 12s;
    animation-delay: -8s;
}

.snow9 {
    left: 91%;
    font-size: 16px;
    animation-duration: 9s;
    animation-delay: -1s;
}

.snow10 {
    left: 97%;
    font-size: 25px;
    animation-duration: 16s;
    animation-delay: -9s;
}

@keyframes snowFall {

    from {
        transform:
            translateY(-40px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(360deg);
    }

}


/* =====================================================
   LUCKANS FÖNSTER
===================================================== */

.game-overlay {
    position: fixed;

    inset: 0;

    background:
        rgba(10,0,2,0.84);

    backdrop-filter: blur(5px);

    display: none;

    align-items: center;
    justify-content: center;

    padding: 20px;

    z-index: 20;
}


/* =====================================================
   INNEHÅLLET I LUCKAN
===================================================== */

.game-box {
    width: min(650px, 96%);

    max-height: 90vh;

    overflow-y: auto;

    background:
        linear-gradient(
            145deg,
            #65101a,
            #32080d
        );

    border: 3px solid #e6b94e;

    border-radius: 22px;

    padding: 30px 22px;

    box-shadow:
        0 20px 60px rgba(0,0,0,0.7),
        0 0 30px rgba(255,215,100,0.2);

    position: relative;
}


/* Stäng-knappen */

.close-button {
    position: absolute;

    right: 15px;
    top: 8px;

    border: none;

    background: none;

    color: #ffe7a0;

    font-size: 2rem;

    cursor: pointer;
}


/* =====================================================
   RUBRIK INNE I LUCKAN
===================================================== */

.game-title {
    margin: 5px 35px 15px;

    color: #ffe49a;

    font-size: 2rem;
}


/* =====================================================
   TEXT INNE I LUCKAN
===================================================== */

.game-text {
    color: #fff4d2;

    font-size: 1.15rem;

    line-height: 1.55;
}


/* =====================================================
   MOBIL
===================================================== */

@media (max-width: 700px) {

    .calendar {
        grid-template-columns: repeat(2, 1fr);

        gap: 10px;
    }

    .door {
        min-height: 125px;

        font-size: 2.2rem;
    }

    .garland {
        letter-spacing: 4px;

        font-size: 1.5rem;
    }

    .game-box {
        padding: 25px 15px;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     SNÖ
===================================================== -->

<div class="snow snow1">❄</div>
<div class="snow snow2">❄</div>
<div class="snow snow3">❄</div>
<div class="snow snow4">❄</div>
<div class="snow snow5">❄</div>
<div class="snow snow6">❄</div>
<div class="snow snow7">❄</div>
<div class="snow snow8">❄</div>
<div class="snow snow9">❄</div>
<div class="snow snow10">❄</div>


<!-- =====================================================
     RUBRIK
===================================================== -->

<h1>
    🎄 Julens Hemlighet 🎄
</h1>

<p class="subtitle">
    Öppna en lucka varje dag...
</p>

<p class="subtitle">
    ✨ Men alla hemligheter är inte vad de verkar vara ✨
</p>

<div class="garland">
    ✦ 🎄 ✦ 🕯️ ✦ 🎄 ✦
</div>


<!-- =====================================================
     ALLA 24 LUCKOR
===================================================== -->

<div class="calendar">

    <div class="door" data-day="1">1</div>
    <div class="door" data-day="2">2</div>
    <div class="door" data-day="3">3</div>
    <div class="door" data-day="4">4</div>

    <div class="door" data-day="5">5</div>
    <div class="door" data-day="6">6</div>
    <div class="door" data-day="7">7</div>
    <div class="door" data-day="8">8</div>

    <div class="door" data-day="9">9</div>
    <div class="door" data-day="10">10</div>
    <div class="door" data-day="11">11</div>
    <div class="door" data-day="12">12</div>

    <div class="door" data-day="13">13</div>
    <div class="door" data-day="14">14</div>
    <div class="door" data-day="15">15</div>
    <div class="door" data-day="16">16</div>

    <div class="door" data-day="17">17</div>
    <div class="door" data-day="18">18</div>
    <div class="door" data-day="19">19</div>
    <div class="door" data-day="20">20</div>

    <div class="door" data-day="21">21</div>
    <div class="door" data-day="22">22</div>
    <div class="door" data-day="23">23</div>
    <div class="door" data-day="24">24</div>

</div>


<!-- =====================================================
     FOOTER
===================================================== -->

<div class="footer">
    🎁 Ett litet mysterium väntar bakom varje lucka... 🎁
</div>


<!-- =====================================================
     LUCKANS FÖNSTER
===================================================== -->

<div class="game-overlay" id="gameOverlay">

    <div class="game-box">

        <button
            class="close-button"
            id="closeGame">
            ×
        </button>

        <div id="gameContent"></div>

    </div>

</div>


<script>

/* =====================================================
   TESTLÄGE
===================================================== */

/*
   JUST NU:

   24 = alla luckor är öppna.

   Det gör att vi kan bygga och testa
   alla luckor utan att behöva vänta på december.

   När kalendern är färdig:

   ändra:

   const TEST_DAY = 24;

   till:

   const TEST_DAY = 0;

   Då styrs luckorna automatiskt
   av dagens datum i december.
*/

const TEST_DAY = 24;


/* =====================================================
   SPARADE LUCKOR
===================================================== */

/*
   Här sparas vilka luckor som är markerade
   som färdiga.

   Detta använder webbläsarens localStorage.
*/

let solvedDoors =
    JSON.parse(
        localStorage.getItem("solvedDoors")
    ) || [];


/* =====================================================
   DATUM
===================================================== */

const today = new Date();

let currentDay = TEST_DAY;


/*
   Om TEST_DAY är 0 använder vi
   det riktiga decemberdatumet.
*/

if (TEST_DAY === 0) {

    if (today.getMonth() === 11) {

        currentDay =
            today.getDate();

    } else {

        currentDay = 0;

    }

}


/* =====================================================
   HÄMTA ELEMENT
===================================================== */

const doors =
    document.querySelectorAll(".door");

const overlay =
    document.getElementById("gameOverlay");

const content =
    document.getElementById("gameContent");

const closeGame =
    document.getElementById("closeGame");


/* =====================================================
   UPPDATERA LUCKOR
===================================================== */

function updateDoor(door) {

    const day =
        Number(
            door.dataset.day
        );


    /*
       Om luckan redan är klar
    */

    if (
        solvedDoors.includes(day)
    ) {

        door.classList.add("solved");

        door.classList.remove("locked");

        door.textContent = "✓";

        return;
    }


    /*
       Om luckan inte är öppen ännu
    */

    if (
        day > currentDay
    ) {

        door.classList.add("locked");

        door.classList.remove("solved");

        door.textContent = "🔒";

        return;
    }


    /*
       Vanlig öppen lucka
    */

    door.classList.remove("locked");

    door.classList.remove("solved");

    door.textContent = day;

}


/* Uppdatera alla luckor */

doors.forEach(
    updateDoor
);


/* =====================================================
   MARKERA LUCKA SOM KLAR
===================================================== */

function markAsSolved(day) {

    if (
        !solvedDoors.includes(day)
    ) {

        solvedDoors.push(day);

        localStorage.setItem(
            "solvedDoors",
            JSON.stringify(
                solvedDoors
            )
        );

    }


    const door =
        document.querySelector(
            `.door[data-day="${day}"]`
        );


    if (door) {

        updateDoor(door);

    }

}


/* =====================================================
   ÖPPNA LUCKANS FÖNSTER
===================================================== */

function openGame() {

    overlay.style.display = "flex";

}


/* =====================================================
   STÄNG LUCKANS FÖNSTER
===================================================== */

function closeGameWindow() {

    overlay.style.display = "none";

    content.innerHTML = "";

}


closeGame.addEventListener(
    "click",
    closeGameWindow
);


/*
   Klick utanför rutan stänger också.
*/

overlay.addEventListener(
    "click",
    function(event) {

        if (
            event.target === overlay
        ) {

            closeGameWindow();

        }

    }
);


/* =====================================================
   INNEHÅLL FÖR LUCKORNA
===================================================== */

/*
   HÄR KOMMER VI SENARE ATT LÄGGA IN
   INNEHÅLLET FÖR VARJE LUCKA.

   Exempel:

   1: {
       title: "Lucka 1",
       content: "Här kommer din text..."
   }

   2: {
       title: "Lucka 2",
       content: "Här kommer något annat..."
   }

   osv.

   JUST NU ÄR ALLA TOMMA.
*/


const doorContent = {

    1: {
        title: "🎁 Lucka 1",
        content: ""
    },

    2: {
        title: "🎁 Lucka 2",
        content: ""
    },

    3: {
        title: "🎁 Lucka 3",
        content: ""
    },

    4: {
        title: "🎁 Lucka 4",
        content: ""
    },

    5: {
        title: "🎁 Lucka 5",
        content: ""
    },

    6: {
        title: "🎁 Lucka 6",
        content: ""
    },

    7: {
        title: "🎁 Lucka 7",
        content: ""
    },

    8: {
        title: "🎁 Lucka 8",
        content: ""
    },

    9: {
        title: "🎁 Lucka 9",
        content: ""
    },

    10: {
        title: "🎁 Lucka 10",
        content: ""
    },

    11: {
        title: "🎁 Lucka 11",
        content: ""
    },

    12: {
        title: "🎁 Lucka 12",
        content: ""
    },

    13: {
        title: "🎁 Lucka 13",
        content: ""
    },

    14: {
        title: "🎁 Lucka 14",
        content: ""
    },

    15: {
        title: "🎁 Lucka 15",
        content: ""
    },

    16: {
        title: "🎁 Lucka 16",
        content: ""
    },

    17: {
        title: "🎁 Lucka 17",
        content: ""
    },

    18: {
        title: "🎁 Lucka 18",
        content: ""
    },

    19: {
        title: "🎁 Lucka 19",
        content: ""
    },

    20: {
        title: "🎁 Lucka 20",
        content: ""
    },

    21: {
        title: "🎁 Lucka 21",
        content: ""
    },

    22: {
        title: "🎁 Lucka 22",
        content: ""
    },

    23: {
        title: "🎁 Lucka 23",
        content: ""
    },

    24: {
        title: "🎄 Lucka 24 🎄",
        content: ""
    }

};


/* =====================================================
   ÖPPNA EN LUCKA
===================================================== */

function openDoor(day) {

    const data =
        doorContent[day];


    /*
       Här skapar vi själva innehållet
       i luckans popup.
    */

    content.innerHTML = `

        <div class="game-title">
            ${data.title}
        </div>

        <div class="game-text">

            ${data.content || `
                ✨ Den här luckan väntar på sitt innehåll. ✨
            `}

        </div>

    `;


    openGame();

}


/* =====================================================
   KLICKA PÅ LUCKOR
===================================================== */

doors.forEach(
    function(door) {

        door.addEventListener(
            "click",
            function() {

                const day =
                    Number(
                        door.dataset.day
                    );


                /*
                   Låst lucka
                */

                if (
                    day > currentDay
                ) {

                    alert(
                        "🎅 Den här luckan är inte öppen ännu!"
                    );

                    return;
                }


                /*
                   Öppen lucka
                */

                openDoor(day);

            }
        );

    }
);


/* =====================================================
   SLUT
===================================================== */

</script>

</body>
</html>
