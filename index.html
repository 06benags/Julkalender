<!DOCTYPE html>

<html lang="sv">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Julens Hemlighet</title>

<style>

/* ================================
   GRUND
   ================================ */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    padding: 35px 15px 60px;

    text-align: center;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    color: #fff5dc;

    background:

        radial-gradient(
            circle at 50% 0%,
            #a83242 0%,
            #5a1522 30%,
            #2b0911 65%,
            #100307 100%
        );

    overflow-x: hidden;
}


/* ================================
   MYSIGT LJUS I BAKGRUNDEN
   ================================ */

body::before {

    content: "";

    position: fixed;

    width: 500px;
    height: 500px;

    left: 50%;
    top: 80px;

    transform: translateX(-50%);

    background:
        radial-gradient(
            circle,
            rgba(255,210,120,0.15),
            transparent 70%
        );

    pointer-events: none;

    z-index: -1;
}


/* ================================
   RUBRIK
   ================================ */

h1 {

    margin: 5px 0 8px;

    font-size: 58px;

    color: #fff3c9;

    text-shadow:

        0 0 8px
        rgba(255,220,140,0.9),

        0 0 25px
        rgba(255,180,80,0.4),

        0 5px 12px
        rgba(0,0,0,0.7);
}


.subtitle {

    font-size: 20px;

    line-height: 1.6;

    color: #f5d9a5;

    margin-bottom: 45px;

    text-shadow:
        0 2px 4px rgba(0,0,0,0.6);
}


/* ================================
   LITEN JULDEKORATION
   ================================ */

.garland {

    max-width: 900px;

    margin:
        0 auto 35px;

    font-size: 28px;

    letter-spacing: 15px;

    color: #f3c65d;

    text-shadow:
        0 0 10px
        rgba(255,210,90,0.8);
}


/* ================================
   KALENDER
   ================================ */

.calendar {

    max-width: 950px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 22px;

}


/* ================================
   LUCKOR
   ================================ */

.door {

    position: relative;

    height: 155px;

    display: flex;

    align-items: center;

    justify-content: center;

    background:

        linear-gradient(
            145deg,
            #c93647,
            #941827 55%,
            #68101b
        );

    border:
        4px solid #dcb65e;

    border-radius: 14px;

    color: #fff3d0;

    font-size: 44px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:

        inset 0 0 25px
        rgba(0,0,0,0.25),

        inset 0 0 8px
        rgba(255,220,140,0.15),

        0 8px 20px
        rgba(0,0,0,0.55);

    transition:

        transform 0.25s ease,

        box-shadow 0.25s ease,

        filter 0.25s ease;
}


/* Inner guldram */

.door::before {

    content: "";

    position: absolute;

    inset: 9px;

    border:
        1px solid
        rgba(255,240,190,0.55);

    border-radius: 9px;

    pointer-events: none;
}


/* Liten stjärna */

.door::after {

    content: "✦";

    position: absolute;

    top: 10px;

    right: 14px;

    font-size: 15px;

    color: #ffe9a8;

    opacity: 0.75;
}


/* Hover */

.door:hover {

    transform:
        translateY(-7px)
        scale(1.035);

    filter: brightness(1.12);

    box-shadow:

        inset 0 0 30px
        rgba(255,220,130,0.18),

        0 16px 32px
        rgba(0,0,0,0.65),

        0 0 18px
        rgba(255,190,80,0.15);
}


/* ================================
   LÅSTA LUCKOR
   ================================ */

.locked {

    background:

        linear-gradient(
            145deg,
            #403034,
            #21171a
        );

    border-color: #65544d;

    color: #8e817b;

    cursor: not-allowed;

    opacity: 0.72;

    box-shadow:

        inset 0 0 25px
        rgba(0,0,0,0.45),

        0 6px 15px
        rgba(0,0,0,0.5);
}


.locked:hover {

    transform: none;

    filter: none;

    box-shadow:

        inset 0 0 25px
        rgba(0,0,0,0.45),

        0 6px 15px
        rgba(0,0,0,0.5);
}


/* ================================
   SNÖ
   ================================ */

.snow {

    position: fixed;

    top: -30px;

    color: white;

    pointer-events: none;

    z-index: 100;

    opacity: 0.9;

    animation:
        snowFall linear infinite;
}


/* Olika storlekar */

.snow1 {
    left: 4%;
    font-size: 12px;
    animation-duration: 9s;
}

.snow2 {
    left: 12%;
    font-size: 22px;
    animation-duration: 13s;
    animation-delay: 2s;
}

.snow3 {
    left: 21%;
    font-size: 15px;
    animation-duration: 10s;
    animation-delay: 4s;
}

.snow4 {
    left: 31%;
    font-size: 28px;
    animation-duration: 15s;
    animation-delay: 1s;
}

.snow5 {
    left: 42%;
    font-size: 11px;
    animation-duration: 8s;
    animation-delay: 3s;
}

.snow6 {
    left: 52%;
    font-size: 20px;
    animation-duration: 12s;
    animation-delay: 5s;
}

.snow7 {
    left: 63%;
    font-size: 14px;
    animation-duration: 10s;
    animation-delay: 2s;
}

.snow8 {
    left: 73%;
    font-size: 30px;
    animation-duration: 16s;
    animation-delay: 6s;
}

.snow9 {
    left: 84%;
    font-size: 17px;
    animation-duration: 11s;
    animation-delay: 1s;
}

.snow10 {
    left: 94%;
    font-size: 24px;
    animation-duration: 14s;
    animation-delay: 4s;
}


@keyframes snowFall {

    0% {

        transform:
            translateY(-30px)
            translateX(0)
            rotate(0deg);

    }

    50% {

        transform:
            translateY(50vh)
            translateX(25px)
            rotate(180deg);

    }

    100% {

        transform:
            translateY(110vh)
            translateX(-20px)
            rotate(360deg);

    }

}


/* ================================
   LITEN TEXT LÄNGST NER
   ================================ */

.footer {

    margin-top: 45px;

    color: #cda978;

    font-size: 15px;

    opacity: 0.8;
}


/* ================================
   MOBIL
   ================================ */

@media (max-width: 700px) {

    body {

        padding:
            25px 12px 50px;
    }

    h1 {

        font-size: 38px;
    }

    .subtitle {

        font-size: 17px;

        margin-bottom: 30px;
    }

    .garland {

        font-size: 20px;

        letter-spacing: 8px;
    }

    .calendar {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 14px;
    }

    .door {

        height: 120px;

        font-size: 34px;
    }

}

</style>

</head>

<body>

<!-- ================================
     SNÖ
     ================================ -->

<div class="snow snow1">❄</div>
<div class="snow snow2">❄</div>
<div class="snow snow3">❄</div>
<div class="snow snow4">❄</div>
<div class="snow snow5">❄</div>
<div class="snow snow6">❄</div>
<div class="snow snow7">❄</div>
<div class="snow snow8">❄</div>
<div class="snow snow9">❄</div>
<div class="snow snow10">❄</div>

<!-- ================================
     RUBRIK
     ================================ -->

<h1>
🎄 Julens Hemlighet 🎄
</h1>

<div class="subtitle">

Öppna en lucka varje dag...

<br>

✨ Men alla hemligheter är inte vad de verkar vara ✨

</div>

<!-- JULDEKORATION -->

<div class="garland">

✦ 🎄 ✦ 🕯️ ✦ 🎄 ✦

</div>

<!-- ================================
     KALENDER
     ================================ -->

<div class="calendar">

<div class="door" data-day="1">1</div>

<div class="door" data-day="2">2</div>

<div class="door" data-day="3">3</div>

<div class="door" data-day="4">4</div>

<div class="door" data-day="5">5</div>

<div class="door" data-day="6">6</div>

<div class="door" data-day="7">7</div>

<div class="door" data-day="8">8</div>

<div class="door" data-day="9">9</div>

<div class="door" data-day="10">10</div>

<div class="door" data-day="11">11</div>

<div class="door" data-day="12">12</div>

<div class="door" data-day="13">13</div>

<div class="door" data-day="14">14</div>

<div class="door" data-day="15">15</div>

<div class="door" data-day="16">16</div>

<div class="door" data-day="17">17</div>

<div class="door" data-day="18">18</div>

<div class="door" data-day="19">19</div>

<div class="door" data-day="20">20</div>

<div class="door" data-day="21">21</div>

<div class="door" data-day="22">22</div>

<div class="door" data-day="23">23</div>

<div class="door" data-day="24">24</div>

</div>

<div class="footer">

🎁 Ett litet mysterium väntar bakom varje lucka...

</div>

<!-- ================================
     JAVASCRIPT
     ================================ -->

<script>


/*
TESTLÄGE

5 betyder att lucka 1–5 är öppna.

När kalendern är färdig:

const TEST_DAY = 0;

Då används det riktiga datumet.
*/


const TEST_DAY = 5;


let currentDay;


if (TEST_DAY > 0) {

    currentDay = TEST_DAY;

}

else {

    const today = new Date();

    const month = today.getMonth();

    const date = today.getDate();


    if (month === 11) {

        currentDay = date;

    }

    else {

        currentDay = 0;

    }

}


/*
HÄMTA LUCKORNA
*/

const doors =
document.querySelectorAll(".door");


/*
LÅS / ÖPPNA
*/

doors.forEach(function(door) {


    const day =
        Number(door.dataset.day);


    if (day > currentDay) {

        door.classList.add("locked");

        door.textContent = "🔒";

    }


    door.addEventListener(
        "click",
        function() {


            if (day > currentDay) {

                alert(
                    "🎅 Den här luckan är inte öppen ännu!"
                );

            }

            else {

                alert(
                    "🎁 Du öppnade lucka "
                    + day
                    + "!"
                );

            }

        }
    );

});


</script>

</body>

</html>
