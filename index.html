
<!DOCTYPE html>

<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Min Julkalender</title>

<style>

body {
    margin: 0;
    padding: 30px 15px;
    min-height: 100vh;
    text-align: center;
    font-family: Georgia, serif;

    background:
        linear-gradient(
            #7d1727,
            #26070d
        );

    color: white;
}

h1 {
    font-size: 50px;
    margin-bottom: 10px;
}

p {
    font-size: 20px;
    margin-bottom: 40px;
}

.calendar {
    max-width: 900px;
    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap: 20px;
}

.door {
    height: 140px;

    display: flex;

    align-items: center;
    justify-content: center;

    background: #b52638;

    border: 5px solid #d9ad4c;

    border-radius: 15px;

    font-size: 40px;
    font-weight: bold;

    color: white;

    cursor: pointer;

    box-shadow:
        0 8px 15px rgba(0,0,0,0.5);
}

.door:hover {
    transform: scale(1.05);
}

.locked {
    background: #3a3032;

    border-color: #655b59;

    color: #aaa;

    cursor: not-allowed;
}

@media (max-width: 700px) {

    h1 {
        font-size: 35px;
    }

    .calendar {
        grid-template-columns:
            repeat(2, 1fr);

        gap: 12px;
    }

    .door {
        height: 110px;
        font-size: 30px;
    }

}

</style>

</head>

<body>

<h1>🎄 Min Julkalender 🎄</h1>

<p>
Öppna en lucka varje dag! 🎁
</p>

<div class="calendar">

<div class="door" data-day="1">1</div>
<div class="door" data-day="2">2</div>
<div class="door" data-day="3">3</div>
<div class="door" data-day="4">4</div>

<div class="door" data-day="5">5</div>
<div class="door" data-day="6">6</div>
<div class="door" data-day="7">7</div>
<div class="door" data-day="8">8</div>

<div class="door" data-day="9">9</div>
<div class="door" data-day="10">10</div>
<div class="door" data-day="11">11</div>
<div class="door" data-day="12">12</div>

<div class="door" data-day="13">13</div>
<div class="door" data-day="14">14</div>
<div class="door" data-day="15">15</div>
<div class="door" data-day="16">16</div>

<div class="door" data-day="17">17</div>
<div class="door" data-day="18">18</div>
<div class="door" data-day="19">19</div>
<div class="door" data-day="20">20</div>

<div class="door" data-day="21">21</div>
<div class="door" data-day="22">22</div>
<div class="door" data-day="23">23</div>
<div class="door" data-day="24">24</div>

</div>

<script>

const TEST_DAY = 5;

const doors =
document.querySelectorAll(".door");


doors.forEach(function(door) {

    const day =
    Number(door.dataset.day);


    if (day > TEST_DAY) {

        door.classList.add("locked");

        door.textContent = "🔒";

    }


    door.addEventListener("click", function() {

        if (day > TEST_DAY) {

            alert(
                "🎅 Den här luckan är låst!"
            );

        } else {

            alert(
                "🎁 Du öppnade lucka " +
                day +
                "!"
            );

        }

    });

});

</script>

</body>
</html>
