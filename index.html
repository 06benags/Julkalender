<!DOCTYPE html>
<html lang="sv">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Julens Hemlighet</title>


    <style>

        * {
            box-sizing: border-box;
        }


        /* ==============================
           HELA SIDAN
           ============================== */

        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 50% 0%,
                    #8b2635 0%,
                    #4a101c 35%,
                    #21080e 70%,
                    #100407 100%
                );

            color: #fff4dc;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            text-align: center;

            padding: 35px 15px;

            overflow-x: hidden;
        }


        /* ==============================
           SNÖ
           ============================== */

        .snow {
            position: fixed;

            top: -10px;

            color: white;

            pointer-events: none;

            z-index: 1000;

            animation-name: fall;

            animation-timing-function: linear;

            animation-iteration-count: infinite;
        }


        @keyframes fall {

            0% {
                transform: translateY(-10vh);
            }

            100% {
                transform: translateY(110vh);
            }

        }


        /* ==============================
           RUBRIK
           ============================== */

        h1 {

            font-size: 56px;

            margin: 10px 0 5px;

            color: #fff3cf;

            text-shadow:
                0 0 8px rgba(255, 220, 140, 0.9),
                0 0 25px rgba(255, 180, 80, 0.35),
                0 5px 12px rgba(0, 0, 0, 0.7);
        }


        .subtitle {

            font-size: 21px;

            color: #f4d9a6;

            margin-top: 8px;

            margin-bottom: 45px;
        }


        /* ==============================
           KALENDERN
           ============================== */

        .calendar {

            width: 100%;

            max-width: 950px;

            margin: 0 auto;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 22px;
        }


        /* ==============================
           LUCKOR
           ============================== */

        .door {

            position: relative;

            height: 150px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #b82e3b,
                    #8b1724
                );

            border: 4px solid #d9ad55;

            border-radius: 14px;

            color: #fff1ce;

            font-size: 44px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:

                inset 0 0 25px
                rgba(0, 0, 0, 0.25),

                0 8px 20px
                rgba(0, 0, 0, 0.5);

            transition:

                transform 0.25s ease,

                box-shadow 0.25s ease,

                filter 0.25s ease;
        }


        /* Guldram runt luckan */

        .door::before {

            content: "";

            position: absolute;

            top: 9px;

            left: 9px;

            right: 9px;

            bottom: 9px;

            border:

                1px solid
                rgba(255, 239, 190, 0.5);

            border-radius: 9px;

            pointer-events: none;
        }


        /* Litet julkors */

        .door::after {

            content: "✦";

            position: absolute;

            top: 10px;

            right: 14px;

            font-size: 15px;

            color: #ffe8a8;

            opacity: 0.7;
        }


        /* När musen ligger över */

        .door:hover {

            transform:
                translateY(-6px)
                scale(1.03);

            box-shadow:

                inset 0 0 30px
                rgba(255, 220, 140, 0.2),

                0 15px 30px
                rgba(0, 0, 0, 0.6);

            filter: brightness(1.12);
        }


        /* ==============================
           LÅSTA LUCKOR
           ============================== */

        .locked {

            background:
                linear-gradient(
                    145deg,
                    #3c292d,
                    #211519
                );

            border-color: #66554e;

            color: #817572;

            cursor: not-allowed;

            opacity: 0.72;
        }


        .locked:hover {

            transform: none;

            filter: none;

            box-shadow:

                inset 0 0 25px
                rgba(0, 0, 0, 0.25),

                0 8px 20px
                rgba(0, 0, 0, 0.5);
        }


        /* ==============================
           INFO
           ============================== */

        #message {

            min-height: 25px;

            color: #f1d9a5;

            font-size: 18px;

            margin-top: 35px;
        }


        /* ==============================
           MOBIL
           ============================== */

        @media (max-width: 700px) {

            body {

                padding:
                    25px 12px;
            }


            h1 {

                font-size: 38px;
            }


            .subtitle {

                font-size: 17px;

                margin-bottom: 30px;
            }


            .calendar {

                grid-template-columns:
                    repeat(2, 1fr);

                gap: 14px;
            }


            .door {

                height: 120px;

                font-size: 34px;
            }

        }


    </style>

</head>


<body>


    <!-- ==========================
         SNÖ
         ========================== -->

    <div class="snow" style="left: 5%; font-size: 20px; animation-duration: 9s;">❄</div>

    <div class="snow" style="left: 15%; font-size: 14px; animation-duration: 12s; animation-delay: 2s;">❄</div>

    <div class="snow" style="left: 27%; font-size: 22px; animation-duration: 10s; animation-delay: 4s;">❄</div>

    <div class="snow" style="left: 40%; font-size: 13px; animation-duration: 14s; animation-delay: 1s;">❄</div>

    <div class="snow" style="left: 52%; font-size: 19px; animation-duration: 11s; animation-delay: 3s;">❄</div>

    <div class="snow" style="left: 64%; font-size: 15px; animation-duration: 13s; animation-delay: 5s;">❄</div>

    <div class="snow" style="left: 76%; font-size: 23px; animation-duration: 9s; animation-delay: 2s;">❄</div>

    <div class="snow" style="left: 88%; font-size: 16px; animation-duration: 12s; animation-delay: 6s;">❄</div>


    <!-- ==========================
         RUBRIK
         ========================== -->

    <h1>
        🎄 Julens Hemlighet 🎄
    </h1>


    <div class="subtitle">

        Öppna en lucka varje dag...

        <br>

        <span>
            ✨ Men alla hemligheter är inte vad de verkar vara ✨
        </span>

    </div>


    <!-- ==========================
         KALENDER
         ========================== -->

    <div class="calendar">


        <div class="door" data-day="1">1</div>

        <div class="door" data-day="2">2</div>

        <div class="door" data-day="3">3</div>

        <div class="door" data-day="4">4</div>

        <div class="door" data-day="5">5</div>

        <div class="door" data-day="6">6</div>

        <div class="door" data-day="7">7</div>

        <div class="door" data-day="8">8</div>

        <div class="door" data-day="9">9</div>

        <div class="door" data-day="10">10</div>

        <div class="door" data-day="11">11</div>

        <div class="door" data-day="12">12</div>

        <div class="door" data-day="13">13</div>

        <div class="door" data-day="14">14</div>

        <div class="door" data-day="15">15</div>

        <div class="door" data-day="16">16</div>

        <div class="door" data-day="17">17</div>

        <div class="door" data-day="18">18</div>

        <div class="door" data-day="19">19</div>

        <div class="door" data-day="20">20</div>

        <div class="door" data-day="21">21</div>

        <div class="door" data-day="22">22</div>

        <div class="door" data-day="23">23</div>

        <div class="door" data-day="24">24</div>


    </div>


    <div id="message"></div>


    <!-- ==========================
         JAVASCRIPT
         ========================== -->

    <script>


        /*
        =========================================
        TESTLÄGE
        =========================================

        Just nu testar vi som om det vore
        den 5 december.

        1 = 1 december
        2 = 2 december
        3 = 3 december
        osv.

        När kalendern är färdig ändrar vi
        denna till 0.

        Då används det riktiga datumet.
        */

        const TEST_DAY = 5;


        /*
        =========================================
        BESTÄM DAG
        =========================================
        */

        let currentDay;


        if (TEST_DAY > 0) {

            currentDay = TEST_DAY;

        }

        else {

            const today = new Date();

            const month = today.getMonth();

            const date = today.getDate();


            /*
            December är månad 11
            eftersom JavaScript börjar
            räkna månader från 0.
            */

            if (month === 11) {

                currentDay = date;

            }

            else {

                currentDay = 0;

            }

        }


        /*
        =========================================
        HÄMTA ALLA LUCKOR
        =========================================
        */

        const doors =
            document.querySelectorAll(".door");


        /*
        =========================================
        LÅS / LÅS UPP
        =========================================
        */

        doors.forEach(function(door) {


            const day =
                Number(door.dataset.day);


            /*
            Om luckan är längre fram
            än dagens datum:
            lås den.
            */

            if (day > currentDay) {

                door.classList.add("locked");

                door.textContent = "🔒";

            }


            /*
            När användaren klickar
            */

            door.addEventListener(
                "click",
                function() {


                    /*
                    Framtida lucka
                    */

                    if (day > currentDay) {

                        alert(
                            "🎅 Den här luckan är inte öppen ännu!"
                        );

                        return;

                    }


                    /*
                    Öppen lucka
                    */

                    alert(
                        "🎁 Du öppnade lucka "
                        + day
                        + "!"
                    );

                }

            );

        });


    </script>


</body>

</html>
