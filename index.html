        * {

                radial-gradient(

                    #3a0d16 45%,
                    #16070b 100%
                );

            color: #fff8e7;

            font-family:
                Georgia,
                "Times New Roman",
                serif;

            text-align: center;

            padding: 40px 20px;

            overflow-x: hidden;
        }

        h1 {
            font-size: 56px;

            margin: 10px 0 5px;

            color: #fff4d6;

            text-shadow:
                0 0 8px rgba(255, 220, 150, 0.8),
                0 4px 10px rgba(0, 0, 0, 0.6);
        }

        p {
            font-size: 21px;

            color: #f8dfb0;

            margin-top: 5px;

            margin-bottom: 45px;
        }

        .calendar {
            max-width: 950px;

            margin: auto;

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 22px;
        }

        .door {
            position: relative;

            height: 150px;

            display: flex;

            align-items: center;

            justify-content: center;

            background:
                linear-gradient(
                    145deg,
                    #b52b38,
                    #7d111e
                );

            border: 4px solid #d6a84f;

            border-radius: 12px;

            color: #fff4d6;

            font-size: 44px;

            font-weight: bold;

            cursor: pointer;

            box-shadow:
                inset 0 0 20px rgba(0, 0, 0, 0.25),
                0 8px 18px rgba(0, 0, 0, 0.45);

            transition:
                transform 0.25s,
                box-shadow 0.25s,
                filter 0.25s;
        }

        .door::before {
            content: "";

            position: absolute;

            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;

            border:
                1px solid
                rgba(255, 235, 170, 0.45);

            border-radius: 7px;

            pointer-events: none;
        }

        .door:hover {
            transform:
                translateY(-5px)
                scale(1.03);

            box-shadow:
                inset 0 0 25px
                rgba(255, 220, 130, 0.2),

                0 12px 25px
                rgba(0, 0, 0, 0.55);

            filter: brightness(1.12);
        }

        .locked {
            background:
                linear-gradient(
                    145deg,
                    #342328,
                    #1d1114
                );

            border-color: #66544b;

            color: #897b76;

            cursor: not-allowed;

            opacity: 0.7;
        }

        .locked:hover {
            transform: none;

            box-shadow:
                inset 0 0 20px
                rgba(0, 0, 0, 0.25),

                0 8px 18px
                rgba(0, 0, 0, 0.45);

            filter: none;
        }

        .snow {
            position: fixed;

            top: -20px;

            color: white;

            pointer-events: none;

            animation:
                snowFall linear infinite;

            z-index: 10;
        }

        @keyframes snowFall {

            from {
                transform: translateY(-20px);
            }

            to {
                transform: translateY(110vh);
            }

        }

        #message {
            margin-top: 35px;

            font-size: 18px;

            color: #f8dfb0;
        }

        @media (max-width: 700px) {

            body {
                padding: 25px 12px;
            }

            h1 {
                font-size: 38px;
            }

            p {
                font-size: 17px;

                margin-bottom: 30px;
            }

            .calendar {
                grid-template-columns:
                    repeat(2, 1fr);

                gap: 14px;
            }

            .door {
                height: 120px;

                font-size: 34px;
            }

        }

    </style>

</head>
