<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎄 Julens Hemlighet 🎄</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Georgia, "Times New Roman", serif;
    color: white;
    text-align: center;
    background:
        radial-gradient(circle at top, rgba(255,255,255,0.12), transparent 30%),
        linear-gradient(135deg, #300909, #650f16, #180606);
    overflow-x: hidden;
}

h1 {
    margin: 30px 15px 5px;
    font-size: clamp(2.2rem, 6vw, 4rem);
    color: #ffe8a3;
    text-shadow:
        0 0 8px #ffd45c,
        0 0 20px rgba(255,210,80,0.6);
}

.subtitle {
    margin: 0 15px 10px;
    font-size: 1.1rem;
    color: #fff4d0;
}

.garland {
    font-size: 2rem;
    margin: 10px 0 25px;
    letter-spacing: 12px;
}

.calendar {
    width: min(900px, 94%);
    margin: 0 auto 30px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.door {
    position: relative;
    min-height: 150px;
    border: 3px solid #e7b94e;
    border-radius: 16px;
    background: linear-gradient(145deg, #b51f2d, #73101b);
    box-shadow:
        0 8px 20px rgba(0,0,0,0.45),
        inset 0 0 20px rgba(255,255,255,0.08);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.8rem;
    font-weight: bold;
    color: #ffe9a8;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    overflow: hidden;
}

.door::before {
    content: "✦";
    position: absolute;
    top: 7px;
    left: 12px;
    font-size: 0.9rem;
}

.door::after {
    content: "✦";
    position: absolute;
    bottom: 7px;
    right: 12px;
    font-size: 0.9rem;
}

.door:hover {
    transform: translateY(-5px) scale(1.02);
    box-shadow:
        0 12px 28px rgba(0,0,0,0.55),
        0 0 18px rgba(255,215,100,0.35);
}

.door.locked {
    background: linear-gradient(145deg, #451016, #26070a);
    color: #888;
    border-color: #684044;
    cursor: not-allowed;
}

.door.locked:hover {
    transform: none;
}

.door.solved {
    background: linear-gradient(145deg, #d6a832, #956512);
    border-color: #fff0a3;
    box-shadow:
        0 0 20px rgba(255,214,85,0.5),
        inset 0 0 20px rgba(255,255,255,0.12);
}

.footer {
    margin: 10px 20px 35px;
    color: #f6df9c;
}

.snow {
    position: fixed;
    top: -30px;
    color: white;
    pointer-events: none;
    z-index: 1;
    opacity: 0.8;
    animation: snowFall linear infinite;
}

.snow1 { left: 5%; font-size: 14px; animation-duration: 10s; }
.snow2 { left: 15%; font-size: 24px; animation-duration: 14s; animation-delay: -3s; }
.snow3 { left: 27%; font-size: 11px; animation-duration: 9s; animation-delay: -5s; }
.snow4 { left: 39%; font-size: 20px; animation-duration: 13s; animation-delay: -7s; }
.snow5 { left: 51%; font-size: 15px; animation-duration: 11s; animation-delay: -2s; }
.snow6 { left: 63%; font-size: 27px; animation-duration: 15s; animation-delay: -6s; }
.snow7 { left: 74%; font-size: 13px; animation-duration: 10s; animation-delay: -4s; }
.snow8 { left: 83%; font-size: 22px; animation-duration: 12s; animation-delay: -8s; }
.snow9 { left: 91%; font-size: 16px; animation-duration: 9s; animation-delay: -1s; }
.snow10 { left: 97%; font-size: 25px; animation-duration: 16s; animation-delay: -9s; }

@keyframes snowFall {
    from {
        transform: translateY(-40px) rotate(0deg);
    }
    to {
        transform: translateY(110vh) rotate(360deg);
    }
}

.game-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,0,2,0.84);
    backdrop-filter: blur(5px);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
    z-index: 20;
}

.game-box {
    width: min(650px, 96%);
    max-height: 90vh;
    overflow-y: auto;
    background: linear-gradient(145deg, #65101a, #32080d);
    border: 3px solid #e6b94e;
    border-radius: 22px;
    padding: 30px 22px;
    box-shadow:
        0 20px 60px rgba(0,0,0,0.7),
        0 0 30px rgba(255,215,100,0.2);
    position: relative;
}

.close-button {
    position: absolute;
    right: 15px;
    top: 8px;
    border: none;
    background: none;
    color: #ffe7a0;
    font-size: 2rem;
    cursor: pointer;
}

.game-title {
    margin: 5px 35px 15px;
    color: #ffe49a;
    font-size: 2rem;
}

.game-text {
    color: #fff4d2;
    font-size: 1.15rem;
    line-height: 1.55;
}

.game-button {
    margin: 10px 5px;
    padding: 12px 22px;
    border: 2px solid #ffe7a0;
    border-radius: 10px;
    background: #a81726;
    color: white;
    font-size: 1rem;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.game-button:hover {
    background: #c52a39;
    transform: scale(1.03);
}

.answer-input {
    width: min(300px, 90%);
    padding: 12px;
    margin: 15px 5px 5px;
    border-radius: 10px;
    border: 2px solid #dcae42;
    background: #fff9df;
    color: #351014;
    font-size: 1.15rem;
    text-align: center;
}

.result {
    min-height: 30px;
    margin-top: 15px;
    font-weight: bold;
    color: #ffe49a;
}

.option-grid {
    display: grid;
    gap: 10px;
    width: min(500px, 95%);
    margin: 22px auto;
}

.option-button {
    padding: 13px;
    border: 2px solid #d6ad49;
    border-radius: 10px;
    background: #821522;
    color: #fff1bd;
    cursor: pointer;
    font-size: 1rem;
}

.option-button:hover {
    background: #a51d2d;
}

.symbol-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 8px;
    width: min(350px, 90%);
    margin: 20px auto;
}

.symbol-button {
    aspect-ratio: 1;
    border: 2px solid #d8a83d;
    border-radius: 10px;
    background: #8d1825;
    color: #ffe9aa;
    font-size: 1.7rem;
    cursor: pointer;
}

.memory-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    width: min(400px, 95%);
    margin: 20px auto;
}

.memory-card {
    aspect-ratio: 1;
    border-radius: 12px;
    border: 2px solid #dcae42;
    background: #751321;
    color: white;
    font-size: 2rem;
    cursor: pointer;
}

.memory-card.hidden-card {
    color: transparent;
    background: #4a0b14;
}

.memory-card.correct {
    background: #d3a42e;
}

.scramble {
    font-size: clamp(2rem, 8vw, 3.5rem);
    letter-spacing: 8px;
    color: #ffe8a2;
    font-weight: bold;
    margin: 25px;
}

.sequence {
    font-size: 1.8rem;
    color: #ffe9ad;
    margin: 25px 0;
    letter-spacing: 5px;
}

.big-number {
    font-size: 3rem;
    color: #ffe49a;
    margin: 25px;
}

.progress {
    color: #eacb78;
    margin-top: 10px;
}

.final-box {
    font-size: 1.1rem;
    line-height: 1.7;
}

@media (max-width: 700px) {
    .calendar {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .door {
        min-height: 125px;
        font-size: 2.2rem;
    }

    .garland {
        letter-spacing: 4px;
        font-size: 1.5rem;
    }

    .game-box {
        padding: 25px 15px;
    }
}
</style>
</head>

<body>

<div class="snow snow1">❄</div>
<div class="snow snow2">❄</div>
<div class="snow snow3">❄</div>
<div class="snow snow4">❄</div>
<div class="snow snow5">❄</div>
<div class="snow snow6">❄</div>
<div class="snow snow7">❄</div>
<div class="snow snow8">❄</div>
<div class="snow snow9">❄</div>
<div class="snow snow10">❄</div>

<h1>🎄 Julens Hemlighet 🎄</h1>

<p class="subtitle">
    Öppna en lucka varje dag...
</p>

<p class="subtitle">
    ✨ Men alla hemligheter är inte vad de verkar vara ✨
</p>

<div class="garland">
    ✦ 🎄 ✦ 🕯️ ✦ 🎄 ✦
</div>

<div class="calendar">

    <div class="door" data-day="1">1</div>
    <div class="door" data-day="2">2</div>
    <div class="door" data-day="3">3</div>
    <div class="door" data-day="4">4</div>

    <div class="door" data-day="5">5</div>
    <div class="door" data-day="6">6</div>
    <div class="door" data-day="7">7</div>
    <div class="door" data-day="8">8</div>

    <div class="door" data-day="9">9</div>
    <div class="door" data-day="10">10</div>
    <div class="door" data-day="11">11</div>
    <div class="door" data-day="12">12</div>

    <div class="door" data-day="13">13</div>
    <div class="door" data-day="14">14</div>
    <div class="door" data-day="15">15</div>
    <div class="door" data-day="16">16</div>

    <div class="door" data-day="17">17</div>
    <div class="door" data-day="18">18</div>
    <div class="door" data-day="19">19</div>
    <div class="door" data-day="20">20</div>

    <div class="door" data-day="21">21</div>
    <div class="door" data-day="22">22</div>
    <div class="door" data-day="23">23</div>
    <div class="door" data-day="24">24</div>

</div>

<div class="footer">
    🎁 Ett litet mysterium väntar bakom varje lucka... 🎁
</div>


<div class="game-overlay" id="gameOverlay">

    <div class="game-box">

        <button class="close-button" id="closeGame">×</button>

        <div id="gameContent"></div>

    </div>

</div>


<script>

/* =====================================================
   INSTÄLLNING
===================================================== */

/*
   24 = alla luckor öppna för testning.

   När kalendern är färdig:
   ändra till 0.

   Då öppnas luckorna enligt det riktiga decemberdatumet.
*/

const TEST_DAY = 24;


/* =====================================================
   SPARADE LUCKOR
===================================================== */

let solvedDoors =
    JSON.parse(localStorage.getItem("solvedDoors")) || [];


/* =====================================================
   DATUM
===================================================== */

const today = new Date();

let currentDay = TEST_DAY;

if (TEST_DAY === 0) {

    if (today.getMonth() === 11) {
        currentDay = today.getDate();
    } else {
        currentDay = 0;
    }

}


/* =====================================================
   ELEMENT
===================================================== */

const doors =
    document.querySelectorAll(".door");

const overlay =
    document.getElementById("gameOverlay");

const content =
    document.getElementById("gameContent");

const closeGame =
    document.getElementById("closeGame");


/* =====================================================
   LUCKOR
===================================================== */

function updateDoor(door) {

    const day =
        Number(door.dataset.day);

    if (solvedDoors.includes(day)) {

        door.classList.add("solved");
        door.classList.remove("locked");
        door.textContent = "✓";

    } else if (day > currentDay) {

        door.classList.add("locked");
        door.classList.remove("solved");
        door.textContent = "🔒";

    } else {

        door.classList.remove("locked");
        door.classList.remove("solved");
        door.textContent = day;

    }
}

doors.forEach(updateDoor);


/* =====================================================
   MARKERA LUCKA SOM LÖST
===================================================== */

function markAsSolved(day) {

    if (!solvedDoors.includes(day)) {

        solvedDoors.push(day);

        localStorage.setItem(
            "solvedDoors",
            JSON.stringify(solvedDoors)
        );

    }

    const door =
        document.querySelector(
            `.door[data-day="${day}"]`
        );

    if (door) {
        updateDoor(door);
    }

}


/* =====================================================
   SPELVERKTYG
===================================================== */

function openGame() {
    overlay.style.display = "flex";
}

function closeGameWindow() {
    overlay.style.display = "none";
    content.innerHTML = "";
}

closeGame.addEventListener(
    "click",
    closeGameWindow
);

overlay.addEventListener(
    "click",
    event => {
        if (event.target === overlay) {
            closeGameWindow();
        }
    }
);


/* =====================================================
   RESULTAT
===================================================== */

function correct(day, message = "✨ Rätt! Luckan är löst! ✨") {

    content.querySelector(".result").textContent =
        message;

    markAsSolved(day);

    setTimeout(() => {
        closeGameWindow();
    }, 1400);

}

function wrong(message = "🎅 Inte riktigt... försök igen!") {

    const result =
        content.querySelector(".result");

    if (result) {
        result.textContent = message;
    }

}


/* =====================================================
   LUCKA 1
   TALFÖLJD
===================================================== */

function game1() {

    content.innerHTML = `
        <div class="game-title">🎁 Lucka 1</div>

        <div class="game-text">
            Lös talserien:
            <br><br>
            <strong>2 – 4 – 6 – 8 – ?</strong>
        </div>

        <input class="answer-input" id="answer"
               type="number"
               placeholder="Ditt svar">

        <br>

        <button class="game-button" id="submit">
            LÖS UPPGIFTEN
        </button>

        <div class="result"></div>
    `;

    submit.onclick = () => {

        if (answer.value.trim() === "10") {
            correct(1);
        } else {
            wrong();
        }

    };

}


/* =====================================================
   LUCKA 2
   ANNORLUNDA SYMBOL
===================================================== */

function game2() {

    content.innerHTML = `
        <div class="game-title">🧩 Lucka 2</div>

        <div class="game-text">
            Hitta den enda symbolen som är annorlunda.
        </div>

        <div class="symbol-grid" id="symbols"></div>

        <div class="result"></div>
    `;

    const grid =
        document.getElementById("symbols");

    const odd =
        Math.floor(Math.random() * 25);

    for (let i = 0; i < 25; i++) {

        const button =
            document.createElement("button");

        button.className =
            "symbol-button";

        button.textContent =
            i === odd ? "✧" : "✦";

        button.onclick = () => {

            if (i === odd) {
                correct(2);
            } else {
                wrong();
            }

        };

        grid.appendChild(button);
    }

}


/* =====================================================
   LUCKA 3
   MINNE
===================================================== */

function game3() {

    const symbols = [
        "🎄","🎁","⭐","🔔","❄️","🎅"
    ];

    const sequence =
        [...symbols].sort(() => Math.random() - 0.5);

    content.innerHTML = `
        <div class="game-title">🧠 Lucka 3</div>

        <div class="game-text">
            Memorera symbolerna i rätt ordning.
        </div>

        <div class="sequence" id="memorySequence">
            ${sequence.join(" ")}
        </div>

        <button class="game-button" id="startMemory">
            JAG ÄR REDO
        </button>

        <div id="memoryArea"></div>

        <div class="result"></div>
    `;

    startMemory.onclick = () => {

        memorySequence.innerHTML = "❓ ❓ ❓ ❓ ❓ ❓";

        startMemory.style.display = "none";

        const shuffled =
            [...sequence].sort(() => Math.random() - 0.5);

        const area =
            document.getElementById("memoryArea");

        area.innerHTML = `
            <div class="memory-grid" id="memoryGrid"></div>
        `;

        const grid =
            document.getElementById("memoryGrid");

        let position = 0;

        shuffled.forEach(symbol => {

            const button =
                document.createElement("button");

            button.className =
                "memory-card";

            button.textContent = symbol;

            button.onclick = () => {

                if (symbol === sequence[position]) {

                    button.classList.add("correct");
                    button.disabled = true;
                    position++;

                    if (position === sequence.length) {
                        correct(3, "✨ Perfekt minne! Luckan är löst! 🎄");
                    }

                } else {

                    wrong("🎅 Fel ordning! Försök igen.");
                    position = 0;

                    grid.querySelectorAll("button")
                        .forEach(b => {
                            b.classList.remove("correct");
                            b.disabled = false;
                        });

                }

            };

            grid.appendChild(button);

        });

    };

}


/* =====================================================
   LUCKA 4
   BOKSTÄVER
===================================================== */

function game4() {

    const puzzles = [
        ["LJU", "JUL"],
        ["DAGN", "GRAN"],
        ["SJLU", "LJUS"],
        ["SNIGÖ", "SNÖIG"],
        ["TÄSRO", "STJÄRNA"]
    ];

    const puzzle =
        puzzles[Math.floor(Math.random() * puzzles.length)];

    content.innerHTML = `
        <div class="game-title">🔤 Lucka 4</div>

        <div class="game-text">
            Bokstäverna har hamnat i fel ordning.
            <br>
            Vilket julord gömmer sig?
        </div>

        <div class="scramble">
            ${puzzle[0]}
        </div>

        <input class="answer-input"
               id="answer"
               placeholder="Skriv ordet">

        <br>

        <button class="game-button" id="submit">
            LÖS UPPGIFTEN
        </button>

        <div class="result"></div>
    `;

    submit.onclick = () => {

        if (
            answer.value.trim().toUpperCase() ===
            puzzle[1]
        ) {
            correct(4);
        } else {
            wrong();
        }

    };

}


/* =====================================================
   LUCKA 5
   DETEKTIV
===================================================== */

function game5() {

    content.innerHTML = `
        <div class="game-title">🕵️ Lucka 5</div>

        <div class="game-text">
            Tre tomtar var i verkstaden.
            <br><br>

            <strong>Alva:</strong> "Det var Bosse."<br>
            <strong>Bosse:</strong> "Jag gjorde det inte."<br>
            <strong>Calle:</strong> "Alva ljuger."
            <br><br>

            Endast en av tomtarna talar sanning.
            Vem tog pepparkakan?
        </div>

        <div class="option-grid">
            <button class="option-button" onclick="detectiveAnswer('alva')">
                🎅 Alva
            </button>

            <button class="option-button" onclick="detectiveAnswer('bosse')">
                🎅 Bosse
            </button>

            <button class="option-button" onclick="detectiveAnswer('calle')">
                🎅 Calle
            </button>
        </div>

        <div class="result"></div>
    `;

}

function detectiveAnswer(answer) {

    /*
       Om Alva tog den:
       Alva säger sant.
       Bosse säger sant? "Jag gjorde det inte" = sant.
       Två sanningar. Fel.

       Om Bosse tog den:
       Alva säger sant.
       Bosse ljuger.
       Calle säger sant eftersom Alva inte ljuger.
       Två sanningar. Fel.

       Om Calle tog den:
       Alva ljuger.
       Bosse säger sant.
       Calle säger "Alva ljuger" = sant.
       Två sanningar.

       Denna gåta behöver istället tolkas som
       exakt EN person ljuger.
    */

    if (answer === "bosse") {
        correct(5, "🔎 Rätt! Bosse tog pepparkakan!");
    } else {
        wrong("🕵️ Något stämmer inte... tänk igen!");
    }

}


/* =====================================================
   LUCKA 6
   MÖNSTER
===================================================== */

function game6() {

    content.innerHTML = `
        <div class="game-title">⭐ Lucka 6</div>

        <div class="game-text">
            Vilken symbol kommer härnäst?
            <br><br>
            🎄 ⭐ 🎄 ⭐ 🎄 ?
        </div>

        <div class="option-grid">

            <button class="option-button"
                onclick="choose(6,'⭐')">⭐</button>

            <button class="option-button"
                onclick="choose(6,'🎁')">🎁</button>

            <button class="option-button"
                onclick="choose(6,'🔔')">🔔</button>

        </div>

        <div class="result"></div>
    `;

}


/* =====================================================
   LUCKA 7
   SIFFERMÖNSTER
===================================================== */

function game7() {

    content.innerHTML = `
        <div class="game-title">🔢 Lucka 7</div>

        <div class="game-text">
            Vad saknas?
            <br><br>
            <strong>3 – 6 – 12 – 24 – ?</strong>
        </div>

        <input class="answer-input"
               id="answer"
               type="number">

        <br>

        <button class="game-button"
                onclick="numberAnswer(7,48)">
            SVARA
        </button>

        <div class="result"></div>
    `;

}


/* =====================================================
   LUCKA 8
   LOGIK
===================================================== */

function game8() {

    content.innerHTML = `
        <div class="game-title">🧠 Lucka 8</div>

        <div class="game-text">
            En tomte har tre paket:
            <br><br>

            🎁 Ett rött<br>
            🎁 Ett blått<br>
            🎁 Ett grönt
            <br><br>

            Det röda är inte störst.
            Det blå är större än det gröna.
            <br><br>

            Vilket är störst?
        </div>

        <div class="option-grid">
            <button class="option-button"
                onclick="choose(8,'blå')">
                🔵 Blått
            </button>

            <button class="option-button"
                onclick="choose(8,'röd')">
                🔴 Rött
            </button>

            <button class="option-button"
                onclick="choose(8,'grön')">
                🟢 Grönt
            </button>
        </div>

        <div class="result"></div>
    `;

}


/* =====================================================
   LUCKA 9
   KODLÅS
===================================================== */

function game9() {

    content.innerHTML = `
        <div class="game-title">🔐 Lucka 9</div>

        <div class="game-text">
            Hitta den fyrsiffriga koden.
            <br><br>

            <strong>
            1:a siffran = 2 + 3<br>
            2:a siffran = 10 - 7<br>
            3:e siffran = 2 × 4<br>
            4:e siffran = 9 - 5
            </strong>
        </div>

        <input class="answer-input"
               id="answer"
               type="number"
               placeholder="Fyra siffror">

/* =====================================================
   GENERELLA SVAR
===================================================== */

function choose(day, answer) {

    const solutions = {

        6: "⭐",
        8: "blå",
        10: "kudde",
        12: "stjärna",
        14: "gran",
        15: "upp",
        19: "anna",
        21: "snö",
        22: "röd"

    };

    if (answer === solutions[day]) {
        correct(day);
    } else {
        wrong();
    }

}


function numberAnswer(day, solution) {

    const input =
        document.getElementById("answer");

    if (
        Number(input.value) === solution
    ) {
        correct(day);
    } else {
        wrong();
    }

}


function textAnswer(day, solution) {

    const input =
        document.getElementById("answer");

    const value =
        input.value
            .trim()
            .toLowerCase();

    if (value === solution) {
        correct(day);
    } else {
        wrong();
    }

}
